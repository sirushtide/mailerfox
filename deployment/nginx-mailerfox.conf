server {
    listen 443 ssl;
    server_name app.gorealo.org;
    ssl_certificate /etc/letsencrypt/live/app.gorealo.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.gorealo.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/mailpurse/public;
    index index.php;
    server_tokens off;
    client_max_body_size 36m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 120;
    }
    location ~ \.php(?:/|$) { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
    location ~* ^/(?:vendor|config|database|bootstrap|resources|routes|tests|dev)(?:/|$) { return 404; }
    access_log /var/log/nginx/mailpurse-access.log;
    error_log /var/log/nginx/mailpurse-error.log;
}
server {
    listen 443 ssl;
    server_name gorealo.org;
    ssl_certificate /etc/letsencrypt/live/app.gorealo.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.gorealo.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://app.gorealo.org$request_uri;
}
server {
    listen 80;
    server_name app.gorealo.org gorealo.org;
    return 301 https://app.gorealo.org$request_uri;
}
